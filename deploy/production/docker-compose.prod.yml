name: stealthsync-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  backend:
    build:
      context: ../..
      dockerfile: Back-end/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 10000
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      VAULT_SERVER_SECRET: ${VAULT_SERVER_SECRET}
      TOKEN_ENCRYPTION_SECRET: ${TOKEN_ENCRYPTION_SECRET}
      STEALTHSYNC_VAULT_DIR: /var/data/stealthsync-vault
      STEALTHSYNC_FRONTEND_URL: https://${PUBLIC_DOMAIN}
      STEALTHSYNC_ALLOWED_ORIGINS: https://${PUBLIC_DOMAIN}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET}
      GOOGLE_DRIVE_REDIRECT_URI: https://${PUBLIC_DOMAIN}/cloud-storage/oauth/google/callback
      GOOGLE_DRIVE_LOGIN_HINT: ${GOOGLE_DRIVE_LOGIN_HINT:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      DROPBOX_CLIENT_ID: ${DROPBOX_CLIENT_ID}
      DROPBOX_CLIENT_SECRET: ${DROPBOX_CLIENT_SECRET}
      DROPBOX_REDIRECT_URI: https://${PUBLIC_DOMAIN}/cloud-storage/dropbox/callback
      ONEDRIVE_CLIENT_ID: ${ONEDRIVE_CLIENT_ID}
      ONEDRIVE_CLIENT_SECRET: ${ONEDRIVE_CLIENT_SECRET}
      ONEDRIVE_REDIRECT_URI: https://${PUBLIC_DOMAIN}/cloud-storage/onedrive/callback
      ONEDRIVE_TENANT: ${ONEDRIVE_TENANT:-common}
      TZ: ${TZ:-Asia/Singapore}
    volumes:
      - vault-data:/var/data/stealthsync-vault
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:10000/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - database
      - application

  frontend:
    build:
      context: ../..
      dockerfile: deploy/production/frontend/Dockerfile
    restart: unless-stopped
    volumes:
      - frontend-assets:/srv
    healthcheck:
      test: ["CMD", "test", "-f", "/srv/.ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - application

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend-assets:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - application
      - public

networks:
  database:
    internal: true
  application:
  public:

volumes:
  postgres-data:
  vault-data:
  frontend-assets:
  caddy-data:
  caddy-config:
