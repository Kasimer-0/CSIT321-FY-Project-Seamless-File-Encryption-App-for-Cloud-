services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stealthsync}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - stealthsync-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-stealthsync}
      STEALTHSYNC_VAULT_DIR: /app/vault
    ports:
      - "${STEALTHSYNC_PORT:-8080}:8080"
    volumes:
      - stealthsync-vault:/app/vault
    depends_on:
      database:
        condition: service_healthy

volumes:
  stealthsync-postgres:
  stealthsync-vault:
