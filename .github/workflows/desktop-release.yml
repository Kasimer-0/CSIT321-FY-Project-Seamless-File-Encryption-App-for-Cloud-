name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test and publish Windows client
    runs-on: windows-latest
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      APP_VERSION: "1.3.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned JDK 21.0.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.2"
          cache: maven

      - name: Require final production URL
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_URL)) {
            throw "Set the repository variable PRODUCTION_URL to the final DuckDNS HTTPS origin."
          }
          $uri = [Uri]$env:PRODUCTION_URL
          if (-not $uri.IsAbsoluteUri -or $uri.Scheme -ne "https") {
            throw "PRODUCTION_URL must be an absolute HTTPS URL."
          }

      - name: Build app image and EXE installer
        shell: pwsh
        run: >-
          ./scripts/build-desktop.ps1
          -PackageType all
          -JdkHome $env:JAVA_HOME
          -AppVersion $env:APP_VERSION
          -ServiceUrl $env:PRODUCTION_URL

      - name: Smoke-test packaged client
        shell: pwsh
        run: >-
          ./scripts/test-desktop-app.ps1
          -ServiceUrl $env:PRODUCTION_URL

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG `
            "dist-desktop/StealthSync-Setup-$env:APP_VERSION.exe" `
            "dist-desktop/SHA256SUMS.txt" `
            --verify-tag `
            --title "StealthSync Windows Client $env:APP_VERSION" `
            --notes "Shared-service Windows client for the final StealthSync production URL.

          The installer contains a Java runtime and dedicated JavaFX window. It does not contain or start Spring Boot, PostgreSQL, Docker, H2, OAuth client secrets, or a local server.

          Verify the installer against SHA256SUMS.txt before running it."
