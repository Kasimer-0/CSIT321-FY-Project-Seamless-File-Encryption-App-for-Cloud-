databases:
  - name: stealthsync-postgres
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    databaseName: stealthsync
    user: stealthsync
    ipAllowList: []

services:
  - type: web
    name: stealthsync-api-fyp-26-s2-32
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Back-end/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    disk:
      name: stealthsync-vault
      mountPath: /var/data/stealthsync-vault
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: stealthsync-postgres
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: stealthsync-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stealthsync-postgres
          property: password
      - key: STEALTHSYNC_VAULT_DIR
        value: /var/data/stealthsync-vault
      - key: JWT_SECRET
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: VAULT_SERVER_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_SECRET
        generateValue: true
      - key: STEALTHSYNC_FRONTEND_URL
        sync: false
      - key: STEALTHSYNC_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REDIRECT_URI
        sync: false
      - key: DROPBOX_CLIENT_ID
        sync: false
      - key: DROPBOX_CLIENT_SECRET
        sync: false
      - key: DROPBOX_REDIRECT_URI
        sync: false
      - key: ONEDRIVE_CLIENT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_SECRET
        sync: false
      - key: ONEDRIVE_REDIRECT_URI
        sync: false
      - key: ONEDRIVE_TENANT
        value: common
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0

  - type: web
    name: stealthsync-web-fyp-26-s2-32
    runtime: static
    buildCommand: cd Front-end && npm ci && npm run build
    staticPublishPath: ./Front-end/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.12.0"
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
