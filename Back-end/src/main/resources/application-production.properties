# Production fails fast when shared-server secrets or public URLs are missing.
stealthsync.frontend-url=${STEALTHSYNC_FRONTEND_URL:${FRONTEND_URL}}
stealthsync.allowed-origins=${STEALTHSYNC_ALLOWED_ORIGINS:${ALLOWED_ORIGINS}}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
stealthsync.jwt.secret=${JWT_SECRET}
stealthsync.oauth.state-secret=${OAUTH_STATE_SECRET}
stealthsync.vault.server-secret=${VAULT_SERVER_SECRET}
stealthsync.google-drive.client-id=${GOOGLE_DRIVE_CLIENT_ID}
stealthsync.google-drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET}
stealthsync.google-drive.redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI}
stealthsync.dropbox.client-id=${DROPBOX_CLIENT_ID}
stealthsync.dropbox.client-secret=${DROPBOX_CLIENT_SECRET}
stealthsync.dropbox.redirect-uri=${DROPBOX_REDIRECT_URI}
stealthsync.onedrive.client-id=${ONEDRIVE_CLIENT_ID}
stealthsync.onedrive.client-secret=${ONEDRIVE_CLIENT_SECRET}
stealthsync.onedrive.redirect-uri=${ONEDRIVE_REDIRECT_URI}
stealthsync.onedrive.tenant=${ONEDRIVE_TENANT:common}
