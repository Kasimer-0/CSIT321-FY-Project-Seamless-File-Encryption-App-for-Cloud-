# Hosted production profile used by Render. Every secret and public URL is
# required; the application fails during startup when a value is omitted.
server.port=${PORT:8080}

stealthsync.frontend-url=${STEALTHSYNC_FRONTEND_URL}
stealthsync.allowed-origins=${STEALTHSYNC_ALLOWED_ORIGINS}

# Render supplies DATABASE_URL. StealthSyncApplication converts it to a JDBC
# URL before Spring Boot starts. DB_URL remains available for other hosts.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

stealthsync.jwt.secret=${JWT_SECRET}
stealthsync.oauth.state-secret=${OAUTH_STATE_SECRET}
stealthsync.vault.server-secret=${VAULT_SERVER_SECRET}
stealthsync.token-encryption-secret=${TOKEN_ENCRYPTION_SECRET}

stealthsync.google-drive.client-id=${GOOGLE_DRIVE_CLIENT_ID}
stealthsync.google-drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET}
stealthsync.google-drive.redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI}
stealthsync.google-drive.login-hint=${GOOGLE_DRIVE_LOGIN_HINT:}
stealthsync.google-drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID:}

stealthsync.dropbox.client-id=${DROPBOX_CLIENT_ID}
stealthsync.dropbox.client-secret=${DROPBOX_CLIENT_SECRET}
stealthsync.dropbox.redirect-uri=${DROPBOX_REDIRECT_URI}

stealthsync.onedrive.client-id=${ONEDRIVE_CLIENT_ID}
stealthsync.onedrive.client-secret=${ONEDRIVE_CLIENT_SECRET}
stealthsync.onedrive.redirect-uri=${ONEDRIVE_REDIRECT_URI}
stealthsync.onedrive.tenant=${ONEDRIVE_TENANT:common}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
