server.port=8080

# Local PostgreSQL defaults target the course database shown in pgAdmin.
# Keep DB_PASSWORD in the environment or use scripts/start-backend-local.ps1;
# never store a real database password in this committed config file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/CSIT321-FYP}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

stealthsync.vault.directory=${STEALTHSYNC_VAULT_DIR:}

stealthsync.google-drive.client-id=${GOOGLE_DRIVE_CLIENT_ID:}
stealthsync.google-drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
stealthsync.google-drive.redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:${server.port}/cloud-storage/google-drive/callback}
# Optional demo account hint and target folder; credentials remain environment-only.
stealthsync.google-drive.login-hint=${GOOGLE_DRIVE_LOGIN_HINT:}
stealthsync.google-drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID:}

stealthsync.dropbox.client-id=${DROPBOX_CLIENT_ID:}
stealthsync.dropbox.client-secret=${DROPBOX_CLIENT_SECRET:}
stealthsync.dropbox.redirect-uri=${DROPBOX_REDIRECT_URI:http://localhost:${server.port}/cloud-storage/dropbox/callback}

stealthsync.onedrive.client-id=${ONEDRIVE_CLIENT_ID:}
stealthsync.onedrive.client-secret=${ONEDRIVE_CLIENT_SECRET:}
stealthsync.onedrive.redirect-uri=${ONEDRIVE_REDIRECT_URI:http://localhost:${server.port}/cloud-storage/onedrive/callback}
stealthsync.onedrive.tenant=${ONEDRIVE_TENANT:common}

# Use JWT_SECRET in shared or production environments.
stealthsync.jwt.secret=${JWT_SECRET:stealthsync-development-jwt-secret-change-before-release}
stealthsync.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
stealthsync.vault.server-secret=${VAULT_SERVER_SECRET:stealthsync-development-vault-secret-change-before-release}
